# Backup panel, stage 1 of 2: port 80 only, used BEFORE the certificate exists.
# It lets win-acme prove the name belongs to this server, and sends everything
# else to https. After the certificate is made, replace this file with
# nginx-backup-panel.conf (setup guide, part 6).
#
# backups.example.com is replaced with your name by the copy command in the guide.

server {
    listen 80;
    server_name backups.example.com;

    # win-acme writes its check files here, the same folder as for the other sites.
    location /.well-known/acme-challenge/ {
        root C:/nginx-1.30.2/html/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
