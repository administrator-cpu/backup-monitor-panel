# Backup panel: the public HTTPS address in front of the panel app on 127.0.0.1:7480.
#
# 1. Replace every backups.example.com with your real name, and point the two
#    certificate lines at the files win-acme made for it (same folder and naming
#    as your other sites' certificates).
# 2. Include this file INSIDE the http { } block of nginx.conf:
#        include C:/nginx-1.30.2/conf/backup-panel.conf;
# 3. Check, then reload:   nginx -t     then   nginx -s reload

# At most 6 sign-in attempts a minute per address (the panel also locks after 5 wrong ones).
limit_req_zone $binary_remote_addr zone=backup_panel_login:1m rate=6r/m;

server {
    listen 80;
    server_name backups.example.com;
    # If win-acme validates over http for your other sites, copy their
    # /.well-known/acme-challenge/ location block here too.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name backups.example.com;

    ssl_certificate     C:/nginx-1.30.2/ssl/backups.example.com-chain.pem;
    ssl_certificate_key C:/nginx-1.30.2/ssl/backups.example.com-key.pem;

    # Its own log, so it does not add to the main access.log.
    access_log logs/backup-panel.access.log;
    client_max_body_size 16k;

    # The agent talks to 127.0.0.1:7480 directly. Its API is never public.
    location /api/agent/ {
        return 404;
    }

    location = /api/login {
        limit_req zone=backup_panel_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:7480;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:7480;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
