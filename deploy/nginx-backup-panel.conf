# Backup panel, stage 2 of 2: the public HTTPS address in front of the panel
# app on 127.0.0.1:7480. Use it only once the certificate files exist in
# C:/nginx-1.30.2/ssl (setup guide, part 6).
#
# backups.example.com is replaced with your name by the copy command in the guide.
# This file is included INSIDE the http { } block of nginx.conf:
#     include C:/nginx-1.30.2/conf/backup-panel.conf;

# At most 6 sign-in attempts a minute per address (the panel also locks after 5 wrong ones).
limit_req_zone $binary_remote_addr zone=backup_panel_login:1m rate=6r/m;

server {
    listen 80;
    server_name backups.example.com;

    # Certificate renewals: win-acme writes its check files here.
    location /.well-known/acme-challenge/ {
        root C:/nginx-1.30.2/html/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name backups.example.com;

    ssl_certificate     C:/nginx-1.30.2/ssl/backups.example.com-chain.pem;
    ssl_certificate_key C:/nginx-1.30.2/ssl/backups.example.com-key.pem;

    # Its own log, so it does not add to the main access.log.
    access_log logs/backup-panel.access.log;
    client_max_body_size 16k;

    location /.well-known/acme-challenge/ {
        root C:/nginx-1.30.2/html/acme;
    }

    # The agent talks to 127.0.0.1:7480 directly. Its API is never public.
    location /api/agent/ {
        return 404;
    }

    location = /api/login {
        limit_req zone=backup_panel_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:7480;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:7480;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
