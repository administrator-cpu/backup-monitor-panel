# Backup panel, stage 2 of 2: the public HTTPS address in front of the panel
# app on 127.0.0.1:7480, with a gate page in front of the sign-in.
# Use it only once the certificate files exist in C:/nginx-1.30.2/ssl and the
# gate key file exists (setup guide, parts 6 and 12).
#
# backups.example.com is replaced with your name by the copy command in the guide.
# This file is included INSIDE the http { } block of nginx.conf (or pasted there).

# The gate key, written by deploy\set-gate-key.ps1. It defines $backup_panel_gate:
# 1 when the browser's bp_gate cookie holds the key, otherwise 0.
include C:/nginx-1.30.2/conf/backup-panel-gate.conf;

# At most 6 sign-in attempts a minute per address (the panel also locks after 5 wrong ones).
limit_req_zone $binary_remote_addr zone=backup_panel_login:1m rate=6r/m;
# At most 10 gate-key tries a minute per address.
limit_req_zone $binary_remote_addr zone=backup_panel_gate:1m rate=10r/m;

server {
    listen 80;
    server_name backups.example.com;

    # Certificate renewals: win-acme writes its check files here.
    location /.well-known/acme-challenge/ {
        root C:/nginx-1.30.2/html/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name backups.example.com;

    ssl_certificate     C:/nginx-1.30.2/ssl/backups.example.com-chain.pem;
    ssl_certificate_key C:/nginx-1.30.2/ssl/backups.example.com-key.pem;

    # Its own log, so it does not add to the main access.log.
    access_log logs/backup-panel.access.log;
    client_max_body_size 16k;

    location /.well-known/acme-challenge/ {
        root C:/nginx-1.30.2/html/acme;
    }

    # The agent talks to 127.0.0.1:7480 directly. Its API is never public.
    location /api/agent/ {
        return 404;
    }

    # ---- The gate: a page served by Nginx itself, before anything reaches the panel app.
    location = /gate {
        return 302 /gate/;
    }
    location ^~ /gate/fonts/ {
        alias C:/Apps/db-backup/panel/public/fonts/;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /gate/check {
        limit_req zone=backup_panel_gate burst=5 nodelay;
        limit_req_status 429;
        # try_files sends the request on after the rate limit has been counted.
        root C:/nginx-1.30.2/html;
        try_files /backup-panel-gate-none @backup_panel_gate_check;
    }
    location @backup_panel_gate_check {
        add_header Cache-Control "no-store" always;
        if ($backup_panel_gate) {
            return 204;
        }
        return 403;
    }
    location ^~ /gate/ {
        alias C:/Apps/db-backup/panel/public/gate/;
        index index.html;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # ---- The panel app, only for browsers that passed the gate.
    location = /api/login {
        if ($backup_panel_gate = 0) {
            return 403;
        }
        limit_req zone=backup_panel_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:7480;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        if ($backup_panel_gate = 0) {
            return 403;
        }
        proxy_pass http://127.0.0.1:7480;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        if ($backup_panel_gate = 0) {
            return 302 /gate/;
        }
        proxy_pass http://127.0.0.1:7480;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
